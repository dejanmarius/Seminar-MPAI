<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>MPAI Spring MVC Demo</title>
</head>
<body>
<p>This is the MPAI Spring MVC - courses page</p>
<table>

    <tr>
        <th></th>
        <th></th>

    </thead>

                <li style="display:flex; align-items: center; margin-bottom: 10px">

                    <form  method="post">

                    </form>
                </li>

</html>
