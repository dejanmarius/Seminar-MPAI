<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Comenzi</title></head>
<body>
<h1>Lista Comenzi</h1>

<form th:action="@{/orders}" method="get">
    <input name="clientName" type="text" placeholder="Cauta dupa email..."/>
    <button type="submit">Cauta</button>
</form>

<a th:href="@{/orders/add}">+ Comanda noua</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th><th>Client</th><th>Email</th>
        <th>Data</th><th>Descriere</th><th>Stare</th><th>Actiuni</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>
        <td th:text="${order.clientName}"></td>
        <td th:text="${order.clientEmail}"></td>
        <td th:text="${order.orderDate}"></td>
        <td th:text="${order.description}"></td>
        <td th:text="${order.status}"></td>
        <td>
            <!-- Clientul poate anula doar daca starea e PLASATA -->
            <form th:if="${order.status == 'PLASATA'}"
                  th:action="@{'/orders/' + ${order.id} + '/cancel'}"
                  method="post">
                <button type="submit">Anuleaza</button>
            </form>
            <span th:if="${order.status != 'PLASATA'}">-</span>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/}">Acasa</a>
</body>
</html>
