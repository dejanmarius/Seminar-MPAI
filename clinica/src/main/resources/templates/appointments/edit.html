<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Programare noua</title></head>
<body>
<h1>Fa o programare</h1>

<!-- action trimite POST la /appointments/save -->
<form th:action="@{/appointments/save}" method="post">
    <div>
        <label>Nume pacient:</label>
        <!-- name="patientName" trebuie sa corespunda cu campul din AppointmentRequest -->
        <input name="patientName" type="text" required/>
    </div>
    <div>
        <label>Email:</label>
        <input name="patientEmail" type="email" required/>
    </div>
    <div>
        <label>Medic:</label>
        <!-- dropdown populat din lista "doctors" trimisa de controller -->
        <!-- th:value="${d.id}" trimite ID-ul medicului, nu numele -->
        <!-- service-ul face getEntityById(doctorId) ca sa obtina entitatea Doctor -->
        <select name="doctorId" required>
            <option th:each="d : ${doctors}"
                    th:value="${d.id}"
                    th:text="${d.name + ' (' + d.specialization + ')'}"></option>
        </select>
    </div>
    <div>
        <label>Data si ora:</label>
        <!-- datetime-local trimite format "yyyy-MM-ddTHH:mm", parsat cu LocalDateTime.parse() -->
        <input name="appointmentDateTime" type="datetime-local" required/>
    </div>
    <div>
        <label>Motiv:</label>
        <input name="reason" type="text" required/>
    </div>
    <button type="submit">Solicita programarea</button>
</form>
<a th:href="@{/appointments}">&#8592; Inapoi</a>
</body>
</html>
